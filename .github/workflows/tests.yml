name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --cov=. вимірює, які рядки коду реально виконались під час тестів
      # (coverage = "покриття тестами"); --cov-report=xml створює machine-readable
      # звіт, який далі читає Codecov, --cov-report=term-missing одразу друкує
      # у логах CI, які саме рядки НЕ виконались жодним тестом.
      - name: Run tests with coverage
        run: pytest -v --cov=. --cov-report=xml --cov-report=term-missing

      # Заливаємо звіт на codecov.io, щоб мати бейдж з % покриття в README
      # і бачити по кожному Pull Request, які рядки новий код не покрив тестами.
      # Завантажуємо лише з однієї версії Python з матриці (3.12), щоб не
      # дублювати той самий звіт двічі за один запуск CI.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}